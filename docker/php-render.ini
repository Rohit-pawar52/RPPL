; PHP's defaults (2M uploads, 128M memory) are too small for payment screenshots, photos and PDFs.
upload_max_filesize=20M
post_max_size=25M
memory_limit=256M

; Render free has very little CPU; caching compiled PHP matters. The image never changes at runtime.
opcache.enable=1
opcache.memory_consumption=64
opcache.validate_timestamps=0
